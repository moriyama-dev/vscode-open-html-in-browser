name: Publish

# A version tag (v0.1.0, ...) builds, tests and publishes that version to the
# Visual Studio Marketplace through Trusted Publishing, then attaches the
# .vsix to a GitHub release. Running the workflow by hand does everything
# except publishing, so the pipeline can be checked without releasing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Exchanged for a short-lived Marketplace credential; no stored token is needed.
      id-token: write
      # Creates the GitHub release.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - run: npm run typecheck
      - run: npm run lint

      # The integration tests start a real VS Code, which needs a display.
      - name: Test
        run: |
          command -v xvfb-run >/dev/null || (sudo apt-get update && sudo apt-get install -y xvfb)
          xvfb-run -a npm test

      - run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: release/*.vsix
          if-no-files-found: error

      - name: Publish to the Visual Studio Marketplace
        if: startsWith(github.ref, 'refs/tags/')
        run: npx vsce publish --oidc --packagePath release/*.vsix

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The release notes are this version's section of CHANGELOG.md.
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" release/*.vsix --title "$GITHUB_REF_NAME" --notes-file release-notes.md
